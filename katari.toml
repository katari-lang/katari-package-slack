[package]
name = "slack"
version = "0.7.0"
description = "A Slack bot capability over Socket Mode: watch channel messages, read back the ones posted while nothing was watching (`list_messages` reads the channel's own history after a message `ts`, so the gap around a restart is recoverable by a bot that kept a cursor), post replies (threads and files included — `try_send` answers with its OUTCOME, `delivered | dropped(reason)`, so a dropped post is never reported as a sent one), and ask a channel for an answer with buttons, selects and forms. The provider serves the workspace's two TOKENS (0.5.0, breaking: the `connection` request is gone), so every call carries what it needs to act and a watcher re-forked after a runtime restart simply connects. Plus the two things only this package can know, shared with the discord twin: Slack's caps as data (`limits`) and a pure local check of a question before it is asked (`check_controls`). The truncation and the keyed pseudonym went back to the prelude in 0.7.0 — `string.fit(value, cap = limits().message_text, marker)` and `crypto.pseudonym(key, value)` — because neither judgement was about Slack. Ships an FFI sidecar (slack.ts)."

[runtime]
url = "http://localhost:3000"

# The sidecar's source root defaults to [package].src ("src"), where slack.ts lives alongside slack.ktr,
# so no explicit [sidecar] section is needed — `katari apply` bundles it into the consumer's snapshot.

[dependencies]
registry = "https://raw.githubusercontent.com/katari-lang/katari-registry/main"
snapshot = "staging"
packages = []
